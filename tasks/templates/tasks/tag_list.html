{% extends "base.html" %}

{% block content %}
  <h1>Tags</h1>
  <a href="{% url 'tasks:tag-add' %}" class="btn btn-primary mb-3">Add tag</a>

  <ul>
    {% for tag in tag_list %}
      <li class="mb-3">
        {{ tag.name }}
        <a href="{% url 'tasks:tag-edit' tag.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
        <a href="{% url 'tasks:tag-delete' tag.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
      </li>
    {% empty %}
      <li>No tags yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
